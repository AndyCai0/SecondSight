<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>SecondSight · Fake Elder Protocol Test</title>
    <style>
      :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #eaf3f1; background: #081513; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 40px; }
      main { width: min(980px, 100%); margin: auto; }
      h1 { margin-bottom: 8px; font-family: Georgia, serif; font-size: 40px; font-weight: 500; }
      p { color: #9aafaa; line-height: 1.7; }
      a { color: #6fe2c0; }
      form, .panel { margin-top: 24px; padding: 24px; border: 1px solid #27423d; border-radius: 16px; background: #102320; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      label { display: grid; gap: 7px; color: #bcd0ca; font-size: 13px; }
      input { width: 100%; padding: 12px; border: 1px solid #36534d; border-radius: 9px; color: #eaf3f1; background: #081513; }
      button { margin-top: 18px; padding: 13px 18px; border: 0; border-radius: 9px; color: #071b17; background: #6fe2c0; font-weight: 750; cursor: pointer; }
      button:disabled { opacity: .5; cursor: wait; }
      code { color: #6fe2c0; }
      #status { color: #6fe2c0; }
      #messages { max-height: 320px; overflow: auto; padding-left: 24px; }
      #messages li { margin: 9px 0; color: #c9d8d4; font-family: ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere; }
      video { width: 100%; margin-top: 20px; border-radius: 12px; background: #030706; }
    </style>
  </head>
  <body>
    <main>
      <p><a href="/">← Back to Volunteer Console</a></p>
      <h1>Fake Elder Protocol Test</h1>
      <p>Call <code>create-session</code> or use a signed elder token, publish the browser screen, and display received DataChannel messages unchanged.</p>
      <form id="connect-form">
        <div class="grid">
          <label>Supabase URL <input id="supabase-url" type="url" /></label>
          <label>Public anon key <input id="anon-key" type="password" autocomplete="off" /></label>
          <label>Signed LiveKit URL (optional) <input id="livekit-url" type="url" placeholder="wss://…" /></label>
          <label>Signed elder token (optional) <input id="livekit-token" type="password" autocomplete="off" /></label>
        </div>
        <button id="connect-button" type="submit">Create Room and Share Screen</button>
      </form>
      <section class="panel">
        <strong>Status:</strong> <span id="status" role="status" aria-live="polite">Not connected</span>
        <p>Room code: <code id="room-code">—</code></p>
        <video id="preview" aria-label="Shared screen preview" autoplay playsinline muted></video>
      </section>
      <section class="panel">
        <h2>Received DataChannel Messages</h2>
        <ol id="messages"></ol>
      </section>
    </main>
    <script type="module" src="/src/fake-elder.ts"></script>
  </body>
</html>
